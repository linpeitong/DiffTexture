[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "difftexture"
version = "0.1.0"
description = "Texton-controlled DDPM inpainting for pulmonary lesion synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "accelerate>=0.26,<1.0",
  "diffusers>=0.26,<0.31",
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
